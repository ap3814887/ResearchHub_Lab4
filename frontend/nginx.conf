server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check самого frontend-контейнера.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Nginx reverse proxy: браузер обращается к тому же origin,
    # Nginx перенаправляет API/health/metrics в ASP.NET Core.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /metrics {
        proxy_pass http://backend:8080/metrics;
        proxy_set_header Host $host;
    }

    # Vue Router history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

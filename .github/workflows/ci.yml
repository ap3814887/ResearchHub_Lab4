name: ResearchHub CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ResearchHub.sln
      - name: Build
        run: dotnet build ResearchHub.sln -c Release --no-restore
      - name: xUnit + Testcontainers PostgreSQL
        run: dotnet test ResearchHub.sln -c Release --no-build --logger "trx;LogFileName=backend-tests.trx"

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Vitest
        run: npm test
      - name: Type check and build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config
      - name: Build images
        run: docker compose build backend frontend
